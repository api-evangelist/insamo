name: Insamo
description: 'Insamo is a biotechnology company building membrane-permeable, orally available cyclic
  peptides that combine the binding affinity of antibodies with the pharmacology of small molecules for
  drug discovery. Its platform automates the design, synthesis, and testing of peptides at large scale and
  applies machine learning across vast chemical spaces to identify therapeutic candidates. Founded in
  February 2024 with $12M from Playground Global, venBio, and MRL Ventures Fund, the company operates from
  Berkeley, California and Chippendale, New South Wales, Australia. Insamo currently publishes no public
  developer or API surface; this profile tracks the company in the API Evangelist network.'
